# Configuración de Servidor
server.port=8080
server.servlet.context-path=/

# Configuración de Nombre de Aplicación
spring.application.name=merkostore-api

# Configuración de MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/merkostore_db
spring.data.mongodb.auto-index-creation=true

# Configuración de Seguridad y JWT
merkostore.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
merkostore.jwt.expiration-ms=86400000

# Configuración de Logs
logging.level.root=INFO
logging.level.com.merkostore.api=DEBUG
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Configuración de Chatbot con Groq Cloud LLM (Llama 3)
merkostore.llm.groq.api-key=${GROQ_API_KEY:}
merkostore.llm.groq.model=llama-3.1-8b-instant
merkostore.llm.groq.api-url=https://api.groq.com/openai/v1/chat/completions

